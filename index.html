<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LinkedIn Unicode Formatter">
  <title>LinkedIn Unicode Formatter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div>
        <h1 id="appTitle">LinkedIn Unicode Formatter</h1>
        <p id="appSubtitle" class="subtitle"></p>
      </div>

      <div class="header-buttons" aria-label="Document actions">
        <button id="undoBtn" type="button"></button>
        <button id="redoBtn" type="button"></button>
        <button id="copyBtn" type="button"></button>
        <button id="clearBtn" type="button"></button>
      </div>
    </header>

    <section class="toolbar" id="toolbar" aria-label="Formatting toolbar"></section>

    <section class="shortcut-help">
      <span id="shortcutTitle"></span>
      <div id="shortcutList"></div>
    </section>

    <section class="editor-wrap">
      <div class="panel">
        <div class="panel-heading">
          <h2 id="editorHeading"></h2>
          <span class="selection-badge" id="selectionInfo"></span>
        </div>
        <textarea id="editor" spellcheck="false" aria-label="Text editor"></textarea>
      </div>

      <div class="panel">
        <div class="panel-heading">
          <h2 id="previewHeading"></h2>
          <span class="preview-badge" id="previewBadge"></span>
        </div>
        <div id="preview" aria-live="polite"></div>
      </div>
    </section>

    <footer>
      <div id="stats">
        <span><span id="charsLabel"></span>: <strong id="charCount">0</strong> / <strong id="maxChars">3000</strong></span>
        <span><span id="wordsLabel"></span>: <strong id="wordCount">0</strong></span>
      </div>
      <div class="progress-track" aria-hidden="true">
        <div id="progressBar"></div>
      </div>
      <div id="statusMessage" class="status-message" role="status"></div>
    </footer>
  </main>

  <script type="module" src="script.js?v=6"></script>
</body>
</html>
