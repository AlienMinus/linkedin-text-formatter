<!DOCTYPE html>
<html>
    <head>
        <meta charset='UTF-8'>
        <meta name='viewport' content='width=device-width,initial-scale=1'>
        <title>LinkedIn Formatter</title>
        <link rel='stylesheet' href='style.css'>
    </head>
    <body>
        <div class='app'>
            <header>
                <h1>LinkedIn Unicode Formatter</h1>
                <div class="header-buttons">
                    <button id='undoBtn'>Undo</button>
                    <button id='redoBtn'>Redo</button>
                    <button id='copyBtn'>📋 Copy Output</button>
                    <button id='clearBtn'>Clear</button>
                </div>
            </header>
            <div class='toolbar'>
                <button class='tool' data-style='bold' title='Bold'>𝗕</button>
                <button class='tool' data-style='italic' title='Italic'>𝐼</button>
                <button class='tool' data-style='boldItalic' title='Bold Italic'>𝑩𝑰</button>
                <button class='tool' data-style='mono' title='Monospace'>Mono</button>
                <button class='tool' data-style='underline' title='Underline'>U̲</button>
                <button class='tool' data-style='strike' title='Strikethrough'>S̶</button>
                <button class='tool' data-style='circled' title='Circled'>Ⓒ</button>
                <button class='tool' data-style='squared' title='Squared'> स्क्वायर</button>
                <button class='tool' data-style='negativeSquared' title='Negative Squared'>🅾</button>
            </div>
            <div class='editor-wrap'>
                <div>
                    <h3>Editor</h3>
                    <textarea id='editor'></textarea>
                </div>
                <div>
                    <h3>Preview</h3>
                    <div id='preview'></div>
                </div>
            </div>
            <footer>
                <div id="stats">
                    <span>Chars: <span id="charCount">0</span> / 3000</span>
                    <span>Words: <span id="wordCount">0</span></span>
                </div>
                <div id="progressBar"></div>
                <div id="selectionInfo">Select text to format</div>
            </footer>
        </div>
        <script src='script.js'></script>
    </body>
</html>
